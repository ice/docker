name: Docker Build

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build image (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t ice-framework:test .

  publish:
    name: Publish image (PHP ${{ matrix.php }})
    # Only push on a tag push or a published GitHub Release, never on plain
    # branch pushes or pull requests.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          push: true
          tags: |
            ghcr.io/ice/framework:php${{ matrix.php }}
            ghcr.io/ice/framework:${{ github.ref_name }}-php${{ matrix.php }}
